name: tests

# Este repo tenia 6 ficheros de test y CERO workflows: nada los corria.
#
# ☠️ AVISO: HOY ESTE WORKFLOW NO PUEDE PASAR, Y NO ES POR LOS TESTS.
# La cuenta esta bloqueada por facturacion y GitHub ni siquiera arranca el job:
#   "The job was not started because your account is locked due to a billing issue."
# El job sale en rojo con CERO steps ejecutados y en ~3 segundos. Si ves este
# check en rojo, mira si tiene steps antes de buscar el fallo en el codigo.
#
# Yo mismo tenia mal la causa: creia que el corte dependia de si el repo era
# PRIVADO. Es falso, y este workflow es la refutacion — este repo es PUBLICO y
# tambien lo bloquean. El control que lo cierra es dentro de UN MISMO repo
# publico (creador-imagenes-de-marca): "Graph Update: pip in ..." sale en verde
# (lo corre la infraestructura de GitHub, no gasta minutos) y "eikon-gates" sale
# en rojo 41 veces (necesita un runner facturable). La variable no es la
# visibilidad: es si el job necesita RUNNER.
#
# => NINGUN repo de la cuenta tiene CI ahora mismo, publico o privado. Este
# fichero queda listo para ser la puerta el dia que se desbloquee la cuenta;
# mientras tanto la unica puerta real es correr la suite a mano.
# Verificado en local, con la misma secuencia de abajo: 7/7 en verde.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: tests de python (sin dependencias)
        run: |
          set -e
          for t in test-codex-probe.py test-antigravity-parse.py \
                   test-gemini-parse.py test-tui.py test-render-frescura.py; do
            echo "::group::$t"
            python3 "$t"
            echo "::endgroup::"
          done

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: tests de node (sin dependencias)
        run: |
          set -e
          for t in test-units.mjs test-mcp.mjs; do
            echo "::group::$t"
            node "$t"
            echo "::endgroup::"
          done
